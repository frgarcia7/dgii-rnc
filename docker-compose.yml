services:
  postgres:
    image: postgres:18
    container_name: dgii_rnc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dgii_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dgii_password}
      POSTGRES_DB: ${DB_NAME:-dgii_rnc}
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dgii_user} -d ${DB_NAME:-dgii_rnc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgii_rnc_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-dgii_user}
      DB_PASSWORD: ${DB_PASSWORD:-dgii_password}
      DB_NAME: ${DB_NAME:-dgii_rnc}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DGII_RNC_URL: ${DGII_RNC_URL:-https://dgii.gov.do/app/WebApps/Consultas/RNC/RNC_CONTRIBUYENTES.zip}
      DGII_LOCAL_ZIP_PATH: ${DGII_LOCAL_ZIP_PATH:-}
      DGII_HTTP_RETRIES: ${DGII_HTTP_RETRIES:-3}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-10000}
      SYNC_HOUR: ${SYNC_HOUR:-3}
      SYNC_MINUTE: ${SYNC_MINUTE:-0}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      ENABLE_MANUAL_SYNC: ${ENABLE_MANUAL_SYNC:-true}
      ALLOW_REMOTE_SYNC: ${ALLOW_REMOTE_SYNC:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BATCH_MAX_ITEMS: ${BATCH_MAX_ITEMS:-200}
      CACHE_MAX_AGE_SECONDS: ${CACHE_MAX_AGE_SECONDS:-300}
      STATS_CACHE_TTL_SECONDS: ${STATS_CACHE_TTL_SECONDS:-300}
      LOOKUP_CACHE_SIZE: ${LOOKUP_CACHE_SIZE:-2048}
      LOOKUP_CACHE_TTL_SECONDS: ${LOOKUP_CACHE_TTL_SECONDS:-300}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_LOOKUP_PER_MINUTE: ${RATE_LIMIT_LOOKUP_PER_MINUTE:-120}
      RATE_LIMIT_SEARCH_PER_MINUTE: ${RATE_LIMIT_SEARCH_PER_MINUTE:-30}
      RATE_LIMIT_BATCH_PER_MINUTE: ${RATE_LIMIT_BATCH_PER_MINUTE:-15}
      RATE_LIMIT_SYNC_PER_MINUTE: ${RATE_LIMIT_SYNC_PER_MINUTE:-5}
      TZ: ${TZ:-America/Santo_Domingo}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres_data:
