[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas de integración que requieren PostgreSQL activo",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

